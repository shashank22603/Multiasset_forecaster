[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multiasset-timesfm-research"
version = "0.1.0"
description = "Multi-asset forecasting and chronological evaluation with TimesFM 3.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "yfinance>=0.2.65,<1",
]

[project.optional-dependencies]
model = ["timesfm==3.0.2", "torch>=2.5,<3"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[project.scripts]
timesfm-lab = "timesfm_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
timesfm_lab = ["static/*", "default_universe.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
